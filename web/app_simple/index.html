<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SpatialVector-HMI — Mobile Assistive Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-viewport">
        <!-- Phone Device Shell -->
        <div class="device-shell">
            <!-- Header Bar -->
            <header class="app-header">
                <div class="header-left">
                    <span class="app-brand-title">SPATIALVECTOR</span>
                    <span class="app-brand-sub">HMI · v2.1</span>
                </div>
                <div class="header-right">
                    <div id="conn-status-badge" class="conn-pill disconnected">
                        <span class="status-dot"></span>
                        <span id="conn-status-txt">Connecting</span>
                    </div>
                    <span id="header-clock" class="mono-clock">--:--:--</span>
                </div>
            </header>

            <!-- Staleness / Offline Watchdog Alert Banner -->
            <div id="staleness-banner" class="staleness-banner" style="display: none;">
                ⚠️ PIPELINE OFFLINE — Waiting for telemetry...
            </div>

            <!-- Main Content Viewport -->
            <main id="main-content-scroll" class="screen-content">
                <!-- Tab 1: Home View (Live Navigation) -->
                <section id="view-home" class="page-view active"></section>

                <!-- Tab 2: Haptics View -->
                <section id="view-haptics" class="page-view"></section>

                <!-- Tab 3: Settings View (Top-Level & Subpages) -->
                <section id="view-settings" class="page-view"></section>
                <section id="view-social-assist" class="page-view subpage"></section>
                <section id="view-adv-inspector" class="page-view subpage"></section>
                <section id="view-adv-replay" class="page-view subpage"></section>
                <section id="view-adv-health" class="page-view subpage"></section>
                <section id="view-adv-export" class="page-view subpage"></section>
            </main>

            <!-- Bottom Navigation Bar (3 Tabs Only) -->
            <nav class="bottom-nav-bar">
                <button class="nav-item active" data-tab="home" onclick="App.switchTab('home')">
                    <div class="nav-icon-box">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                            <polyline points="9 22 9 12 15 12 15 22"></polyline>
                        </svg>
                    </div>
                    <span class="nav-label">Home</span>
                </button>

                <button class="nav-item" data-tab="haptics" onclick="App.switchTab('haptics')">
                    <div class="nav-icon-box">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2a4 4 0 0 0-4 4v7a4 4 0 0 0 8 0V6a4 4 0 0 0-4-4z"></path>
                            <path d="M5 10v2a7 7 0 0 0 14 0v-2"></path>
                            <line x1="12" y1="19" x2="12" y2="22"></line>
                        </svg>
                    </div>
                    <span class="nav-label">Haptics</span>
                </button>

                <button class="nav-item" data-tab="settings" onclick="App.switchTab('settings')">
                    <div class="nav-icon-box">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                        </svg>
                    </div>
                    <span class="nav-label">Settings</span>
                </button>
            </nav>
        </div>
    </div>

    <!-- Shared Modules -->
    <script src="../shared/vdo_ninja_embed.js"></script>
    <script src="../shared/staleness_watchdog.js"></script>
    <script src="../shared/reasoning_formatter.js"></script>
    <script src="../shared/haptic_body_diagram.js"></script>

    <!-- App Pages -->
    <script src="pages/home.js"></script>
    <script src="pages/quick_details.js"></script>
    <script src="pages/haptics.js"></script>
    <script src="pages/settings.js"></script>
    <script src="pages/social_assist.js"></script>
    <script src="pages/advanced/prediction_inspector.js"></script>
    <script src="pages/advanced/test_replay.js"></script>
    <script src="pages/advanced/system_health.js"></script>
    <script src="pages/advanced/logs_export.js"></script>

    <!-- Main Controller -->
    <script src="app.js"></script>
</body>
</html>
