camera:
  device_index: 2
  stream_url: null
  resolution:
  - 1280
  - 720
  target_fps: 30
  queue_size: 5
detector:
  model_path: yolov8n.pt
  confidence_threshold: 0.4
  class_filter:
  - person
  - bicycle
  - car
  - chair
tracker:
  backend: bytetrack
  history_length: 10
  max_missed_frames: 15
optical_flow:
  max_corners: 200
  quality_level: 0.01
  min_distance: 7
  fb_error_threshold_px: 2.0
  reseed_below_point_count: 50
imu:
  serial_port: /dev/ttyUSB0
  baud_rate: 115200
  max_timestamp_drift_s: 0.05
  low_pass_alpha: 0.8
ego_motion:
  fallback_flow_quality_threshold: 0.3
  fallback_caution_widen_factor: 1.5
geometry:
  camera_intrinsics: null
  foe_containment_radius_norm: 0.15
prediction:
  horizon_s: 5.0
  contact_threshold_normalized: 0.05
  corridor_width_normalized: 0.12
  proximity_center_bearing_rad: 0.5236
  proximity_center_scale_threshold: 0.22
  proximity_center_scale_range: 0.45
  proximity_center_scale_floor: 0.17
  proximity_offcenter_scale_threshold: 0.38
  proximity_offcenter_scale_range: 0.45
  proximity_offcenter_scale_floor: 0.28
  proximity_offcenter_cap: 0.8
risk_engine:
  weight_ttc: 0.5
  weight_miss_distance: 0.3
  weight_intersection_confidence: 0.2
  state_thresholds:
    caution: 0.3
    warning: 0.6
    critical: 0.85
  hysteresis_frames_up: 3
  hysteresis_frames_down: 5
  degraded_confidence_threshold: 0.25
corridor_policy:
  num_corridors: 3
  urgency_levels: 5
  all_unsafe_risk_threshold: 0.7
  trend_window_frames: 5
arduino:
  serial_port: COM3
  baud_rate: 115200
  watchdog_timeout_ms: 500
  command_queue_size: 10
telemetry:
  host: 0.0.0.0
  port: 8080
  stale_threshold_s: 1.5
  send_raw_video: false
logging:
  session_dir: sessions/
  schema_version: 1
  log_raw_frames: false

hazard_detector:
  model_path: pothole_yolov8.pt
  min_conf: 0.35
  persistence_required: 2
  allow_heuristic: false
  max_iou_with_yolo: 0.15
  require_ground_confirmation: true  # Two-stage rule: require freespace road/ground confirmation
  advisory_only: true                # Potholes alert visually/audibly, but do not override walk-forward or force-redirect
  camera_height_m: 1.30              # Physical camera height above ground plane in metres
  camera_pitch_deg: 15.0             # Physical camera depression angle below horizon in degrees (null = unknown)
  focal_length_ratio: 0.72           # focal_length_px / frame_width

distance_estimation:
  focal_length_ratio: 0.72
  object_heights_m:
    person: 1.70
    man: 1.75
    woman: 1.65
    child: 1.10
    chair: 0.90
    couch: 0.85
    sofa: 0.85
    dining table: 0.76
    table: 0.76
    desk: 0.76
    laptop: 0.30
    keyboard: 0.04
    mouse: 0.05
    tv: 0.70
    monitor: 0.55
    bottle: 0.28
    cup: 0.16
    wine glass: 0.22
    cell phone: 0.15
    book: 0.24
    bicycle: 1.10
    motorcycle: 1.10
    scooter: 1.10
    car: 1.52
    truck: 2.80
    bus: 3.20
    dog: 0.55
    cat: 0.32
    backpack: 0.55
    suitcase: 0.68
    cone: 0.75
    fire hydrant: 0.55
    stop sign: 1.20
    bench: 0.90
    tree: 3.00
    pole: 3.00

freespace:
  use_segmentation: true
  seg_model_name: nvidia/segformer-b0-finetuned-ade-512-512
  # Configurable SegFormer ADE20K Ground Classes (floor:3, road:6, sidewalk:11, rug:28, path:52)
  ground_classes:
    - 3
    - 6
    - 11
    - 28
    - 52
  # Configurable SegFormer ADE20K Obstacle Classes (wall:0, building:1, sky:2, table:15, desk:33, stairs:53, stairway:59, step:121)
  obstacle_classes:
    - 0
    - 1
    - 2
    - 7
    - 8
    - 10
    - 12
    - 14
    - 15
    - 31
    - 32
    - 33
    - 53
    - 56
    - 59
    - 64
    - 80
    - 102
    - 121
  seg_min_ground: 0.25
  seg_max_obstacle: 0.30
  seg_full_max_obstacle: 0.25
  min_walkable_conf: 0.45
  smoothing_window: 5
  gradient_jump_thresh: 28.0
  continuity_max_delta: 20.0
  continuity_min_bands: 5
  dark_blob_frac_thresh: 0.15
  allow_classical_fallback: false    # Fail-safe: if SegFormer fails to load, refuse WALK_FORWARD unless explicitly enabled

navigation_decision:
  forward_consec_frames_required: 3
  freespace_min_conf: 0.48
  centre_risk_threshold: 0.35
  global_risk_threshold: 0.45
  pothole_block_dist_m: 3.0
